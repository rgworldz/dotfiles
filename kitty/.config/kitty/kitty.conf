# vim:fileencoding=utf-8:foldmethod=marker

shell fish

# Fonts
font_family      family="JetBrainsMonoNL Nerd Font"
font_size        14
bold_font        auto
italic_font      auto
bold_italic_font auto

# Appearance
background_opacity 0.70
background_blur    40
window_padding_width 8

# Cursor
cursor_blink_interval 0
focus_follows_mouse yes

# Remote control
allow_remote_control yes

#Zoom/Maximize the Current Pane
map alt+shift+z toggle_layout stack

# >>> Scene: managed include. Remove this block to detach Scene. >>>
include scene-theme.conf
# <<< Scene <<<
